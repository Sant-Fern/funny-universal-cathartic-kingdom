name: pogo-arena
services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      ALLOWED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
    expose: ["8000"]
    init: true
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cpus: 1
    mem_limit: 256m
  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports: ["127.0.0.1:8080:80"]
    depends_on:
      server:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]
    cpus: 1
    mem_limit: 128m
